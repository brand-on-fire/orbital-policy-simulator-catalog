# Publishes the full active-payload catalog once a day to the catalog-data branch (force-reset, single snapshot).
# Disable this workflow to stop. The only credential is the run's own GITHUB_TOKEN, passed to git via GIT_CONFIG_*.
name: Publish active catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: orbital-catalog-publish
  cancel-in-progress: false

jobs:
  publish:
    # Evaluated before a runner is allocated: a wrong, private or forked repository, or any branch other than the
    # default branch, never runs.
    if: >-
      toJSON(github.event.repository.private) == 'false' &&
      github.event.repository.visibility == 'public' &&
      github.repository == 'brand-on-fire/orbital-policy-simulator-catalog' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Offline tests
        run: node --test tests/*.test.mjs

      - name: Fetch, build and publish the active catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/build-and-publish.mjs

# No cache, upload-artifact, package registry, Pages deployment, larger runner, secrets, Cloudflare binding or paid
# API. One GP request plus the bulk SATCAT per day, force-reset to a single snapshot on the catalog-data branch.
